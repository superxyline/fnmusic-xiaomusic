# 手动 Docker 部署（适用于任何有 Docker 的 NAS/主机，不限于飞牛 App 中心）
# 使用前先构建镜像：  docker build -t fnmusic-xiaomusic:local ./bridge-v2
# 静态 ffmpeg 需预先放到 ./bridge-v2/ffmpeg-static/ffmpeg
# （下载：https://registry.npmmirror.com/-/binary/ffmpeg-static/b6.0/ffmpeg-linux-x64）
#
# 环境变量：
#   NAS_IP      你的 NAS 局域网 IP（小爱音箱回调地址）
#   BRIDGE_PORT 应用端口（默认 58091）
#
# 启动后浏览器打开 http://NAS_IP:58091 走三步向导即可。
services:
  fnmusic:
    image: fnmusic-xiaomusic:local
    container_name: fnmusic-xiaomusic
    restart: unless-stopped
    ports:
      - "${BRIDGE_PORT:-58091}:58091"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - NAS_IP=${NAS_IP:-192.168.31.26}
      - BRIDGE_PORT=${BRIDGE_PORT:-58091}
